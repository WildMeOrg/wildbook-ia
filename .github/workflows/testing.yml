name: Testing

on: push

jobs:
  lint:
    name: Lint code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2

      - uses: actions/setup-python@v2
        name: Install Python
        with:
          python-version: '3.8'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Lint with flake8
        run: |
          flake8 . --count --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --statistics

  test:
    name: Test on ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.7, 3.8, 3.9]

    container:
      image: ${{ matrix.python-version == '3.7' && 'python:3.7-bullseye' || '' }}

    steps:
      - uses: actions/checkout@v2

      - name: Set up Python (non-3.7 only)
        if: ${{ matrix.python-version != '3.7' }}
        uses: actions/setup-python@v2
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies
        run: |
          apt-get update
          bash scripts/ci_prepare_linux_for_build.sh

      - name: Build project
        run: bash run_developer_setup.sh

      - name: Install project
        run: |
          pip install --upgrade pip
          pip install -e .[tests,problematic]
          mkdir -p /tmp/work
          export PYTHONFAULTHANDLER=1
          python -X faulthandler -m wbia --set-workdir /tmp/work --preload-exit

      - name: gdb backtrace (if failed)
        if: failure()
        run: |
          apt-get install -y gdb
          echo -e "r\nbt\nq" | gdb --args python -m wbia --set-workdir /tmp/work --preload-exit

      - name: Test project
        run: pytest --slow --web-tests

      - name: Ensure web loads
        run: |
          timeout 30 python -m wbia.dev --dbdir /tmp/work/db --web || code=$?; if [[ $code -ne 124 && $code -ne 0 ]]; then exit $code; fi

  test_postgres:
    name: Test on ${{ matrix.python-version }} (Postgres)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.7, 3.8, 3.9]

    container:
      image: ${{ matrix.python-version == '3.7' && 'python:3.7-bullseye' || '' }}

    services:
      db:
        image: postgres:10
        env:
          POSTGRES_PASSWORD: wbia
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v2

      - name: Set up Python (non-3.7 only)
        if: ${{ matrix.python-version != '3.7' }}
        uses: actions/setup-python@v2
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies
        run: |
          apt-get update
          bash scripts/ci_prepare_linux_for_build.sh

      - name: Build project
        run: bash run_developer_setup.sh

      - name: Install project
        run: |
          pip install --upgrade pip
          pip install -e .[tests,problematic,postgres]
          mkdir -p /tmp/work
          python -m wbia --set-workdir /tmp/work --preload-exit

      - name: Test project (Postgres)
        run: |
          pytest --slow --web-tests --with-postgres-uri='postgresql://postgres:wbia@localhost:5432/postgres'

      - name: Ensure web loads
        run: |
          timeout 30 python -m wbia.dev --dbdir /tmp/work/db --web || code=$?; if [[ $code -ne 124 && $code -ne 0 ]]; then exit $code; fi
