name: Testing

on: push

jobs:
  lint:
    name: Lint code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2

      - uses: actions/setup-python@v2
        name: Install Python
        with:
          python-version: '3.8'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Lint with flake8
        run: |
          flake8 . --count --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --statistics

  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      max-parallel: 2
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: [3.8, 3.9]

    steps:
      - uses: actions/checkout@v2

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v2
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies for pyhesaff
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libopencv-dev pkg-config

      - name: Install Python dependencies and pyhesaff
        run: |
          python -m pip install --upgrade pip setuptools --ignore-installed --force-reinstall
          pip install scikit-build numpy
          export OpenCV_DIR=/usr/lib/x86_64-linux-gnu/cmake/opencv4
     
      - name: Install pyhesaff
        run: |
           python -m pip install pyhesaff

      - name: Install fairseq (patched)
        run: |
              rm -rf fairseq
              git clone --depth=1 --branch v0.10.2 https://github.com/facebookresearch/fairseq.git
              # Clean out corrupted/incompatible setuptools
              pip uninstall -y setuptools
              rm -rf /opt/hostedtoolcache/Python/3.9.23/x64/lib/python3.9/site-packages/setuptools*
              # Reinstall clean compatible version
              pip install "setuptools==51.3.3" "more-itertools"
              # Build fairseq
              cd fairseq
              pip install --use-pep517 .

      - name: Install other project dependencies (Linux)
        if: ${{ runner.os == 'Linux' }}
        run: |
                  sudo apt-get update
                  sudo apt-get install -y \
                    pgloader \
                    libgeos-dev \
                    libgdal-dev \
                    libproj-dev \
                    libgraphviz-dev \
                    graphviz \
                    postgresql \
                    libopencv-dev \
                    qt5-qmake \
                    qtbase5-dev \
                    qtchooser \
                    qtbase5-dev-tools \
                    qttools5-dev-tools \
                    coreutils
                  python -m pip install wbia-utool@git+https://github.com/WildMeOrg/wbia-utool@main  
                  bash scripts/ci_prepare_linux_for_build.sh

      - name: Install other project dependencies (macOS)
        if: ${{ runner.os == 'macOS' }}
        run: |
          bash scripts/ci_prepare_macos_for_build.sh

      - name: Build project
        run: |
          bash run_developer_setup.sh

      - name: Install project
        run: |
          pip install -e .[tests,problematic]
          mkdir -p /tmp/work
          export PYTHONFAULTHANDLER=1
          python -X faulthandler -m wbia --set-workdir /tmp/work --preload-exit

      - name: gdb backtrace (if failed)
        if: failure()
        run: |
          sudo apt-get install -y gdb
          echo -e "r\nbt\nq" | gdb --args python -m wbia --set-workdir /tmp/work --preload-exit

      - name: Test project
        run: |
          pytest --slow --web-tests

      - name: Ensure web loads
        run: |
          timeout 30 python -m wbia.dev --dbdir /tmp/work/db --web || code=$?; if [[ $code -ne 124 && $code -ne 0 ]]; then exit $code; fi

  test_postgres:
    name: Test on ${{ matrix.os }} (PostGRES)
    runs-on: ${{ matrix.os }}
    strategy:
      max-parallel: 2
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: [3.7, 3.8, 3.9]

    services:
      db:
        image: postgres:10
        env:
          POSTGRES_PASSWORD: wbia
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v2

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v2
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies for pyhesaff
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libopencv-dev pkg-config

      - name: Install Python dependencies and pyhesaff
        run: |
          python -m pip install --upgrade pip setuptools --ignore-installed --force-reinstall

          pip install scikit-build numpy
          export OpenCV_DIR=/usr/lib/x86_64-linux-gnu/cmake/opencv4

      - name: Install pyhesaff
        run: |
           python -m pip install pyhesaff

      - name: Install fairseq (patched)
        run: |
           git clone --depth=1 --branch v0.10.2 https://github.com/facebookresearch/fairseq.git
           cd fairseq
           rm pyproject.toml
           python -m pip install .
           

      - name: Install other project dependencies (Linux)
        if: ${{ runner.os == 'Linux' }}
        run: |
            sudo apt-get update
            sudo apt-get install -y \
              pgloader \
              libgeos-dev \
              libgdal-dev \
              libproj-dev \
              graphviz \
              graphviz-dev \
              postgresql \
              libopencv-dev \
              qt5-qmake \
              qtbase5-dev \
              qtchooser \
              qtbase5-dev-tools \
              qttools5-dev-tools \
              coreutils
            python -m pip install wbia-utool @ git+https://github.com/WildMeOrg/wbia-utool@main  
            bash scripts/ci_prepare_linux_for_build.sh

      - name: Install other project dependencies (macOS)
        if: ${{ runner.os == 'macOS' }}
        run: |
           bash scripts/ci_prepare_macos_for_build.sh

      - name: Build project
        run: |
          bash run_developer_setup.sh

      - name: Install project
        run: |
          pip install -e .[tests,problematic,postgres]
          mkdir -p /tmp/work
          python -m wbia --set-workdir /tmp/work --preload-exit

      - name: Test project
        run: |
          pytest --slow --web-tests --with-postgres-uri='postgresql://postgres:wbia@localhost:5432/postgres'

      - name: Ensure web loads
        run: |
          timeout 30 python -m wbia.dev --dbdir /tmp/work/db --web || code=$?; if [[ $code -ne 124 && $code -ne 0 ]]; then exit $code; fi
