              example:
                status:
                  success: true
                  code: 200
                  message: "Image UUIDs retrieved successfully"
                  cache: -1
                response:
                  - "66ec193a-1619-b3b6-216d-1784b4833b61"
                  - "3833d7c9-820a-44e0-af8c-e06d749e7fce"
                  - "a768243c-4456-4516-a2de-f2abc8702c0a"

  /api/annot/quality/:
    get:
      tags:
        - annotations
        - claude-generated
      summary: (GET) Retrieve quality scores for annotations
      description: |
        Retrieves quality scores for the specified annotations by their annotation IDs (aids).

        Quality scores are integers that represent the visual quality or usefulness of an annotation:
        - 5: excellent - highest quality, ideal for training/identification
        - 4: good - high quality, suitable for most purposes
        - 3: ok - acceptable quality, usable but not ideal
        - 2: poor - low quality, limited usefulness
        - 1: junk - very low quality, should typically be excluded
        - 0: junk - same as 1, very low quality
        - -1: unknown - quality has not been assessed

        Quality scores are commonly used to filter annotations for matching, training, or other operations.
        Many WBIA functions accept a `minqual` parameter to filter out low-quality annotations.

        Source: wbia/control/manual_annot_funcs.py:3589-3630
      parameters:
        - name: aid_list
          in: query
          description: Comma-separated list of annotation IDs (aids) to retrieve quality scores for
          required: true
          style: form
          explode: false
          schema:
            type: array
            items:
              type: integer
          example:
            - 1
            - 2
            - 3
      responses:
        <<: *WBIAStandardErrors
        "200":
          description: Successful operation with annotation quality list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
              examples:
                typical_qualities:
                  summary: Typical quality values
                  value:
                    status:
                      success: true
                      code: 200
                      message: "success"
                      cache: -1
                    response:
                      - 4
                      - 5
                      - 3
                with_unknown_and_junk:
                  summary: Including unknown and junk qualities
                  value:
                    status:
                      success: true
                      code: 200
                      message: "success"
                      cache: -1
                    response:
                      - -1
                      - 0
                      - 2
                      - 4
                      - 5
    put:
      tags:
        - annotations
        - claude-generated
      summary: (PUT) Set quality scores for annotations
      description: |
        Sets quality scores for the specified annotations by their annotation IDs (aids).

        Quality scores are integers that represent the visual quality or usefulness of an annotation:
        - 5: excellent - highest quality, ideal for training/identification
        - 4: good - high quality, suitable for most purposes
        - 3: ok - acceptable quality, usable but not ideal
        - 2: poor - low quality, limited usefulness
        - 1: junk - very low quality, should typically be excluded
        - 0: junk - same as 1, very low quality
        - -1: unknown - quality has not been assessed

        The `aid_list` and `annot_quality_list` must have the same length, as each quality value
        corresponds to the annotation at the same index.

        This operation updates the `annot_quality` column in the `annot` table and invalidates
        related caches.

        Note: To set quality using text values (e.g., "excellent", "good"), use the
        `/api/annot/quality/text/` endpoint instead.

        Source: wbia/control/manual_annot_funcs.py:3639-3662
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - aid_list
                - annot_quality_list
              properties:
                aid_list:
                  type: array
                  description: List of annotation IDs (aids) to set quality scores for
                  items:
                    type: integer
                  example:
                    - 1
                    - 2
                    - 3
                annot_quality_list:
                  type: array
                  description: |
                    List of quality scores corresponding to each annotation ID.
                    Must be the same length as aid_list.
                    Valid values: -1 (unknown), 0 or 1 (junk), 2 (poor), 3 (ok), 4 (good), 5 (excellent)
                  items:
                    type: integer
                    minimum: -1
                    maximum: 5
                  example:
                    - 4
                    - 5
                    - 3
            examples:
              set_high_quality:
                summary: Set annotations to high quality
                value:
                  aid_list: [1, 2, 3]
                  annot_quality_list: [5, 4, 5]
              set_mixed_quality:
                summary: Set mixed quality values
                value:
                  aid_list: [10, 11, 12, 13]
                  annot_quality_list: [3, 4, 2, -1]
              mark_as_junk:
                summary: Mark annotations as junk
                value:
                  aid_list: [100, 101]
                  annot_quality_list: [0, 0]
      responses:
        <<: *WBIAStandardErrors
        "200":
          description: Successful operation, quality scores updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
              example:
                status:
                  success: true
                  code: 200
                  message: "success"
                  cache: -1
                response: null

