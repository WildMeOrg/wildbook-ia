        This endpoint retrieves the image UUID that contains each specified annotation by:
        1. Getting the image rowid (gid) for each annotation
        2. Retrieving the UUID for each image

        The returned UUIDs correspond to the parent images that contain the annotations,
        maintaining the same order as the input annotation list.
      tags:
