  /api/image/uri/:
    get:
      summary: (GET) Get image URI(s) by image ID(s)
      description: |
        Returns a list of image URIs (file paths or URLs) for the specified image GID(s).

        Image URIs are stored relative to the image directory and represent the current location of the image file. This may differ from the original URI if the image has been processed or relocated.

        **Key Points:**
        - URIs are relative to the database's image directory
        - Can be file paths or URLs depending on how images were added
        - Returns URIs in the same order as the input GID list
        - Each GID maps to exactly one URI (1-to-1 relationship)
      tags:
        - images
        - claude-generated
      parameters:
        - name: gid_list
          in: query
          description: |
            Comma-separated list of image IDs (GIDs) to retrieve URIs for.

            **Input Format:**
            - Query parameter accepts comma-separated integers
            - Automatically converted to a list by the API framework
            - Can also be provided as JSON array format: [1,2,3]
          required: true
          style: form
          explode: false
          schema:
            type: array
            items:
              type: integer
              minimum: 1
            minItems: 1
          example:
            - 1
            - 2
            - 3
      responses:
        <<: *WBIAStandardErrors
        "200":
          description: Successfully retrieved image URI list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
              examples:
                multipleImages:
                  summary: Multiple image URIs with different formats
                  value:
                    status:
                      success: true
                      code: 200
                      message: "Success"
                      cache: -1
                    response:
                      - "images/2024/01/zebra_001.jpg"
                      - "imports/batch_002/elephant_023.png"
                      - "http://example.com/wildlife/lion_004.jpg"
    put:
      summary: (PUT) Update image URIs/file paths
      description: |
        Sets the image URIs to new local paths for one or more images.

        This endpoint is used when localizing or unlocalizing images. It updates the
        `image_uri` field in the database, which stores the location of image files.

        **Path Format Guidelines:**
        - **Absolute paths** can refer to files on this machine or in the cloud
          (e.g., `/home/user/images/photo.jpg`, `s3://bucket/photo.jpg`)
        - **Relative paths** are relative to the WBIA image cache directory on this machine
          (e.g., `images/photo.jpg`)

        **Use Cases:**
        - Localizing images: Updating URIs when copying images from remote storage to local cache
        - Unlocalizing images: Updating URIs when moving images from local cache to remote storage
        - Path corrections: Fixing incorrect file paths after directory restructuring

        **Important Notes:**
        - The `gid_list` and `new_gpath_list` must be the same length (one-to-one correspondence)
        - This endpoint only updates the database record; it does not move or copy actual files
        - Both parameters accept scalar values (single integer/string) or arrays

        Source: wbia/control/manual_image_funcs.py:759 (set_image_uris)
      tags:
        - images
        - claude-generated
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - gid_list
                - new_gpath_list
              properties:
                gid_list:
                  description: |
                    List of image row IDs (gids) to update.
                    Must be an array even for a single image.
                  type: array
                  items:
                    type: integer
                  minItems: 1
                  example: [1, 2, 3]
                new_gpath_list:
                  description: |
                    List of new URI/file path strings, one for each image in gid_list.
                    Must be an array even for a single image.

                    Paths can be:
                    - Absolute local paths (e.g., "/home/user/images/photo.jpg")
                    - Relative paths to WBIA image cache (e.g., "images/photo.jpg")
                    - Cloud URIs (e.g., "s3://bucket-name/path/to/image.jpg")
                    - HTTP(S) URLs (e.g., "https://example.com/images/photo.jpg")
                  type: array
                  items:
                    type: string
                  minItems: 1
                  example:
                    - "/var/cache/wbia/images/zebra_001.jpg"
                    - "/var/cache/wbia/images/zebra_002.jpg"
                    - "s3://wildlife-images/2024/zebra_003.jpg"
            examples:
              absolute_paths:
                summary: Update with absolute local paths
                value:
                  gid_list: [1, 2]
                  new_gpath_list:
                    - "/home/wildbook/images/image001.jpg"
                    - "/home/wildbook/images/image002.jpg"
              relative_paths:
                summary: Update with relative paths (relative to WBIA image cache)
                value:
                  gid_list: [5, 6, 7]
                  new_gpath_list:
                    - "images/2024/jan/photo1.jpg"
                    - "images/2024/jan/photo2.jpg"
                    - "images/2024/jan/photo3.jpg"
              cloud_uris:
                summary: Update with S3 URIs
                value:
                  gid_list: [10, 11]
                  new_gpath_list:
                    - "s3://wildlife-bucket/zebra/image_a.jpg"
                    - "s3://wildlife-bucket/zebra/image_b.jpg"
              single_image:
                summary: Update single image (scalar inputs)
                value:
                  gid_list: 42
                  new_gpath_list: "/data/images/localized/elephant_042.jpg"
      responses:
        <<: *WBIAStandardErrors
        "200":
          description: Image URIs successfully updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
              example:
                status:
                  success: true
                  code: 200
                  message: "success"
                  cache: -1
                response: null
        "400":
          description: Missing required parameter or invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
              examples:
                missing_parameter:
                  summary: Missing required parameter
                  value:
                    status:
                      success: false
                      code: 400
                      message: "Missing required parameter: gid_list or new_gpath_list"
                      cache: -1
                    response: null
                length_mismatch:
                  summary: List length mismatch
                  value:
                    status:
                      success: false
                      code: 400
                      message: "gid_list and new_gpath_list must have the same length"
                      cache: -1
                    response: null
                invalid_gid:
                  summary: Invalid image ID
                  value:
                    status:
                      success: false
                      code: 400
                      message: "Invalid gid: image ID does not exist"
                      cache: -1
                    response: null
        "500":
          description: Internal server error or database operation failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
              example:
                status:
                  success: false
                  code: 500
                  message: "Database error: failed to update image_uri"
                  cache: -1
                response: null

  /api/image/gps/:
    get:
      summary: (GET) Get GPS coordinates for images
      description: |
        Returns GPS coordinates (latitude, longitude) tuples for the specified images.

        This endpoint uses a 1-to-1 getter pattern where each image GID maps to a single GPS coordinate tuple.

        **Note:** This endpoint returns -1 values when GPS data is missing. For a version that converts -1 to NaN values, use /api/image/gps2/ instead.

        **Data Source:** Retrieves 'image_gps_lat' and 'image_gps_lon' from the IMAGE_TABLE.
      tags:
        - images
        - claude-generated
      parameters:
        - name: gid_list
          in: query
          description: Comma-separated list of image GIDs (global image IDs) to retrieve GPS coordinates for
          required: true
          style: form
          explode: false
          schema:
            type: array
            items:
              type: integer
              description: Image GID (Global Image ID)
            minItems: 1
          example: [1, 2, 3]
      responses:
        <<: *WBIAStandardErrors
        "200":
          description: Successful operation with GPS coordinate tuples
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
              examples:
                withGPS:
                  summary: Images with GPS data
                  value:
                    status:
                      success: true
                      code: 200
                      message: "GPS coordinates retrieved successfully"
                      cache: -1
                    response:
                      - [34.0522, -118.2437]
                      - [40.7128, -74.0060]
                      - [51.5074, -0.1278]
                mixed:
                  summary: Mixed GPS data availability
                  value:
                    status:
                      success: true
                      code: 200
                      message: "GPS coordinates retrieved successfully"
                      cache: -1
                    response:
                      - [34.0522, -118.2437]
                      - [-1, -1]
                      - [40.7128, -74.0060]
    put:
      tags:
        - images
        - claude-generated
      summary: (PUT) Set GPS coordinates for images
      description: |
        Sets GPS coordinates (latitude and longitude) for one or more images.

        GPS coordinates can be provided in two formats:
        - **gps_list**: Array of [latitude, longitude] tuples (recommended)
        - **lat_list + lon_list**: Separate arrays for latitude and longitude values

        **Coordinate Requirements:**
        - Latitude must be between -90.0 and 90.0 degrees
        - Longitude must be between -180.0 and 180.0 degrees
        - Both coordinates should be provided in decimal degrees format

        **Missing Data:**
        - Use -1 for either latitude or longitude to indicate missing/unknown GPS data
        - When retrieving GPS data via GET, -1 values indicate no GPS information exists

        **Storage:**
        - GPS coordinates are stored in the database as separate latitude and longitude fields
        - Each image ID (gid) in gid_list corresponds to the GPS coordinate at the same index

        This endpoint uses the accessor setter pattern and does not return data on success.

        **Source:** wbia/control/manual_image_funcs.py:1094 - `set_image_gps`
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - gid_list
              properties:
                gid_list:
                  type: array
                  description: List of image IDs (gids) to update with GPS coordinates
                  items:
                    type: integer
                  example: [1, 2, 3]
                gps_list:
                  type: array
                  nullable: true
                  description: |
                    List of GPS coordinates as [latitude, longitude] tuples.
                    Each tuple must contain exactly 2 numbers.
                    Use this OR (lat_list + lon_list), not both.
                    Use -1 for either coordinate to indicate missing data.
                  items:
                    type: array
                    minItems: 2
                    maxItems: 2
                    items:
                      type: number
                      format: double
                  example:
                    - [-1.286389, 36.817223]
                    - [47.606209, -122.332069]
                    - [-1, -1]
                lat_list:
                  type: array
                  nullable: true
                  description: |
                    List of latitude values in decimal degrees (range: -90.0 to 90.0).
                    Must be used together with lon_list.
                    Cannot be used if gps_list is provided.
                    Use -1 to indicate missing/unknown latitude.
                  items:
                    type: number
                    format: double
                    minimum: -90.0
                    maximum: 90.0
                  example: [-1.286389, 47.606209, -1]
                lon_list:
                  type: array
                  nullable: true
                  description: |
                    List of longitude values in decimal degrees (range: -180.0 to 180.0).
                    Must be used together with lat_list.
                    Cannot be used if gps_list is provided.
                    Use -1 to indicate missing/unknown longitude.
                  items:
                    type: number
                    format: double
                    minimum: -180.0
                    maximum: 180.0
                  example: [36.817223, -122.332069, -1]
            examples:
              using_gps_list:
                summary: Setting GPS coordinates using gps_list
                value:
                  gid_list: [1, 2, 3]
                  gps_list:
                    - [-1.286389, 36.817223]
                    - [47.606209, -122.332069]
                    - [-1, -1]
              using_separate_lists:
                summary: Setting GPS coordinates using lat_list and lon_list
                value:
                  gid_list: [1, 2, 3]
                  lat_list: [-1.286389, 47.606209, -1]
                  lon_list: [36.817223, -122.332069, -1]
              marking_missing_data:
                summary: Marking images with no GPS data
                value:
                  gid_list: [4, 5]
                  gps_list:
                    - [-1, -1]
                    - [-1, -1]
      responses:
        <<: *WBIAStandardErrors
        "200":
          description: GPS coordinates successfully updated for the specified images
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
              example:
                status:
                  success: true
                  code: 200
                  message: "Success"
                  cache: -1
                response: null

  /api/image/unixtime/:
    get:
      summary: Get Unix timestamps for images
      description: |
        Returns Unix timestamps (POSIX time) indicating when images were captured.

        This endpoint retrieves the capture time for each image in the provided list. The timestamp represents the number of seconds since the Unix epoch (January 1, 1970 00:00:00 UTC).

        **Time Delta Correction:**
        By default, this endpoint applies time delta corrections stored in the database (via the `timedelta_correction` parameter). These corrections are useful for adjusting camera clock offsets or timezone differences. The correction is applied as: `final_timestamp = raw_timestamp + timedelta`.

        **Missing Data Handling:**
        - If no timestamp data exists for an image, the value `-1` is returned for that image
        - The returned list maintains the same order and length as the input `gid_list`
      tags:
        - images
        - claude-generated
      parameters:
        - name: gid_list
          in: query
          description: |
            Comma-separated list of image IDs (gids) to retrieve timestamps for.
            Each gid is an integer representing the image's row ID in the database.
          required: true
          style: form
          explode: false
          schema:
            type: array
            items:
              type: integer
              format: int64
            minItems: 1
          example:
            - 1
            - 2
            - 3
        - name: timedelta_correction
          in: query
          description: |
            Whether to apply time delta corrections to the raw timestamps.

            - `true` (default): Apply any stored time delta corrections from the database. The final timestamp is calculated as `raw_timestamp + timedelta`.
            - `false`: Return the raw timestamps without any corrections.

            Time delta corrections are useful for adjusting camera clock offsets, timezone differences, or other systematic time errors.
          required: false
          schema:
            type: boolean
            default: true
          example: true
      responses:
        <<: *WBIAStandardErrors
        "200":
          description: Successfully retrieved Unix timestamps for the requested images
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
              examples:
                successful_retrieval:
                  summary: Successful timestamp retrieval
                  description: Example showing timestamps for multiple images, including one without timestamp data
                  value:
                    status:
                      success: true
                      code: 200
                      message: "Success"
                      cache: -1
                    response:
                      - 1609459200
                      - 1612137600
                      - -1
                      - 1614556800
    put:
      summary: (PUT) Set image unix timestamps
      description: |
        Sets the unix timestamp (POSIX time) for one or more images.

        This endpoint updates the image_time_posix field in the database for the specified
        image IDs (gids). Unix timestamps represent the number of seconds since January 1, 1970 (UTC).

        The timestamps set by this endpoint represent the base capture time for images. These can be
        further adjusted by timedelta corrections (see GET endpoint's timedelta_correction parameter),
        but this PUT endpoint only sets the base timestamp value.

        Note: This endpoint modifies the database timestamp but does not modify EXIF metadata
        in the image files themselves.

        The duplicate_behavior parameter controls how duplicate gid_list entries are handled:
        - 'error' (default): Raises an error if duplicate GIDs are provided
        - 'filter': Silently filters out duplicates, keeping only the first occurrence

        This is an alias for set_image_time_posix.

        Source: wbia/control/manual_image_funcs.py:937 (set_image_unixtime)
      tags:
        - images
        - claude-generated
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - gid_list
                - unixtime_list
              properties:
                gid_list:
                  type: array
                  description: |
                    List of image row IDs (GIDs) to update. Each GID is an integer identifier
                    for an image in the database.
                  items:
                    type: integer
                  example: [1, 2, 3, 4]
                unixtime_list:
                  type: array
                  description: |
                    List of unix timestamps (POSIX time) corresponding to each image in gid_list.
                    Unix timestamps are integers representing seconds since January 1, 1970 00:00:00 UTC.
                    Must be the same length as gid_list.

                    Common timestamp values:
                    - 1609459200 = January 1, 2021 00:00:00 UTC
                    - 1640995200 = January 1, 2022 00:00:00 UTC
                    - 1672531200 = January 1, 2023 00:00:00 UTC
                  items:
                    type: integer
                    minimum: 0
                  example: [1609459200, 1625097600, 1640995200, 1656633600]
                duplicate_behavior:
                  type: string
                  description: |
                    Controls how duplicate entries in gid_list are handled.
                    - 'error': Raises an AssertionError if duplicates are found (default behavior)
                    - 'filter': Silently filters out duplicates, keeping only first occurrence
                  enum:
                    - error
                    - filter
                  default: error
            examples:
              basic_update:
                summary: Update timestamps for multiple images
                value:
                  gid_list: [1, 2, 3]
                  unixtime_list: [1609459200, 1625097600, 1640995200]
              with_duplicate_filter:
                summary: Update with duplicate filtering enabled
                value:
                  gid_list: [1, 2, 3, 1, 2]
                  unixtime_list: [1609459200, 1625097600, 1640995200, 1609459200, 1625097600]
                  duplicate_behavior: filter
      responses:
        <<: *WBIAStandardErrors
        "200":
          description: Image timestamps successfully updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
              example:
                status:
                  success: true
                  code: 200
                  message: "success"
                  cache: -1
                response: null
        "400":
          description: |
            Bad request - invalid input parameters.
            Common causes:
            - gid_list and unixtime_list have different lengths
            - Duplicate GIDs provided when duplicate_behavior='error'
            - Invalid timestamp values (negative numbers)
            - Invalid GIDs (non-existent image IDs)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
              examples:
                length_mismatch:
                  summary: List length mismatch
                  value:
                    status:
                      success: false
