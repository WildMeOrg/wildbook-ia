        - claude-generated
      parameters:
        - name: aid_list
          in: query
          description: |
            Comma-separated list of annotation rowids (aids) to retrieve parent image UUIDs for.

            Note: While the parameter accepts a list, query parameters are comma-separated strings
            that will be automatically parsed into a list (e.g., "1,2,3" becomes [1,2,3]).
          required: true
          style: form
          explode: false
          schema:
            type: array
            items:
              type: integer
              description: Annotation rowid (aid)
          example:
            - 1
            - 2
            - 3
      responses:
        <<: *WBIAStandardErrors
        "200":
          description: Successful operation returning parent image UUIDs for annotations
          content:
            application/json:
              schema:
