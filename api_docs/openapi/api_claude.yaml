###############################################################################
# JOB ENGINE ENDPOINTS - Claude Generated
###############################################################################

  /api/engine/job/metadata/:
    get:
      tags:
        - jobs
        - claude-generated
      summary: (GET) Retrieve the input metadata for a specific job
      description: |
        Returns the complete input metadata for a specified job, including the original request parameters, 
        timing information, callback configuration, and job queue settings.

        **Job Metadata vs Status vs Result:**
        - **metadata** (this endpoint): Returns the INPUT metadata - what was requested, when it was received, 
          with what parameters, callback settings, and timing information. Use this to understand what was 
          originally requested and track job lifecycle timing.
        - **status** (/api/engine/job/status/): Returns the current execution state (received, queued, working, 
          completed, exception, etc.). Use this to monitor job progress.
        - **result** (/api/engine/job/result/): Returns the actual OUTPUT/results produced by the completed job. 
          Use this to retrieve job results after completion.

        The metadata includes comprehensive information about:
        - Original request details (action, args, kwargs)
        - Timing milestones (received, started, updated, completed, runtime, turnaround)
        - Callback configuration (URL, method, detailed flag)
        - Job queue settings (lane: fast/slow)
        - Job counter for ordering

        **When to use this endpoint:**
        - Audit job request parameters and configuration
        - Track detailed timing information across job lifecycle
        - Verify callback settings for a job
        - Debug job input parameters
        - Analyze job queue lane assignment

        **Source:** wbia/web/job_engine.py:346
      parameters:
        - name: jobid
          in: query
          required: true
          description: |
            Job ID to retrieve metadata from. This is the unique identifier returned when the job was created.
          schema:
            type: string
          example: "3833d7c9-820a-44e0-af8c-e06d749e7fce"
      responses:
        <<: *WBIAStandardErrors
        "200":
          description: |
            Successful operation with job metadata response.

            Returns the complete input metadata object containing all job configuration and timing information.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
              examples:
                detection_job_metadata:
                  summary: Detection job metadata with timing
                  description: Metadata for a detection job showing all timing milestones
                  value:
                    status:
                      success: true
                      code: 200
                      message: "Job metadata retrieved successfully"
                      cache: -1
                    response:
                      jobcounter: 42
                      action: "start_detect_image"
                      args:
                        - ["3833d7c9-820a-44e0-af8c-e06d749e7fce", "a768243c-4456-4516-a2de-f2abc8702c0a"]
                      kwargs:
                        species: "zebra_plains"
                      callback_url: "https://example.com/webhook/detection-complete"
                      callback_method: "POST"
                      callback_detailed: true
                      request:
                        endpoint: "/api/engine/detect/cnn/yolo/"
                        function: "start_detect_image"
                      times:
                        received: "2025-10-29T10:15:30.123456"
                        started: "2025-10-29T10:15:32.456789"
                        updated: "2025-10-29T10:16:45.789012"
                        completed: "2025-10-29T10:16:45.789012"
                        runtime: "0 hours 1 min. 13 sec. (total: 73 sec.)"
                        turnaround: "0 hours 1 min. 15 sec. (total: 75 sec.)"
                        runtime_sec: 73
                        turnaround_sec: 75
                      lane: "fast"

                matching_job_metadata:
                  summary: Matching job metadata without callback
                  description: Metadata for an annotation matching job with no callback configured
                  value:
                    status:
                      success: true
                      code: 200
                      message: "Job metadata retrieved successfully"
                      cache: -1
                    response:
                      jobcounter: 128
