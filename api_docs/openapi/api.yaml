openapi: 3.0.4

info:
  title: WBIA API
  description: Wildbook's Image Analysis (WBIA) backend service supporting machine learning for wildlife conservation
  version: 4.0.4
  
servers:
  - url: http://localhost:5000
    description: Local development server (WBIA does not have a production server. It is deployed as a backend service to multiple species-specific Wildbook instances.)
    
tags:
  - name: annotations
    description: Operations related to annotations (/api/annot/*)
  - name: images
    description: Operations related to images (/api/image/*)
  - name: detect
    description: Initiate a detection job (/api/engine/detect/*)
  - name: match
    description: Initiate matching between query and target annotations (/api/engine/query/graph/*)
  - name: jobs
    description: Get the status and results of a job (/api/engine/job/*)
    
components:
  schemas: 
    Status: # see status template from wbia/web/apis_engine.py:426-432
      type: object
      properties:
        success: 
          type: boolean
        code:
          oneOf:
            - type: integer
            - type: string
        message: 
          type: string 
        cache:
          type: integer 
      required: 
        - success
        - code
        - message
        - cache

    Envelope: # see template from wbia/web/apis_engine.py:425-435
      type: object
      properties:
        status: 
          $ref: '#/components/schemas/Status'
        response:
          description: Endpoint-specific payload
          nullable: true
      required: [status, response]

    ###############################################################################
    # DETECTION REQUEST BODY SCHEMAS
    ###############################################################################

    SpecificDetectJobRequestBodySchema: 
      type: object 
      required:
        - image_uuid_list
      properties:
        image_uuid_list: # wbia/web/apis_engine.py:777
          type: array
          description: List of image uuids to detect on 
          items:
            type: string
            format: uuid # https://spec.openapis.org/registry/format/
          example: 
            - "3833d7c9-820a-44e0-af8c-e06d749e7fce"
            - "a768243c-4456-4516-a2de-f2abc8702c0a"
        callback_url: # wbia/web/apis_engine.py:778
          type: string
          nullable: true
          format: uri
          description: Optional URL that will be called when detection succeeds or fails
        callback_method: # wbia/web/job_engine.py:2123-2128
          type: string
          nullable: true
          enum: 
            - GET
            - POST
            - PUT
          default: POST 
          description: HTTP method for callback_url, defaults to POST if none is specified
        callback_detailed: # wbia/web/job_engine.py:2133-2137
          type: boolean
          default: false 
          description: Whether to include detailed results in callback
        lane: # wbia/web/job_engine.py:497
          type: string 
          enum:
            - fast
            - slow 
          default: fast
          description: Job queue lane (fast for quick jobs and slow for lower priority jobs)
        jobid: # wbia/web/job_engine.py:1112, wbia/web/job_engine.py:1398
          type: string
          nullable: true
          description: Optional custom job ID # restrictions TBD: https://wildme.slack.com/archives/C09M79QFTMY/p1761066892770159

    GenericDetectJobRequestBodySchema:
      allOf:
        - $ref: '#/components/schemas/SpecificDetectJobRequestBodySchema'
        - type: object
          properties:
            algo: # wbia/web/apis_engine.py:1005
              type: string
              enum:
                - lightnet
                - yolo
              default: lightnet 
              description: Type of model to use (either lightnet (default) or yolo)

    ###############################################################################
    # JOB REQUEST BODY SCHEMAS
    ###############################################################################

    GetJobStatusRequestBodySchema: 
      type: object 
      properties:
        jobid: # wbia/web/job_engine.py:295
          type: string
          nullable: true
          description: |
            Optional Job ID to retrieve status from.
            If not provided, returns status information for all jobs.

    GetJobResultRequestBodySchema: 
      type: object 
      required:
        - jobid
      properties:
        jobid: # wbia/web/job_engine.py:384
          type: string
          description: Job ID to retrieve results from 

    ###############################################################################
    # MATCH REQUEST BODY SCHEMAS
    ###############################################################################

    GetCompleteMatchRequestBodySchema:  
      type: object 
      properties:
        annot_uuid_list: # wbia/web/apis_engine.py:405
          type: array
          nullable: true
          description: |
            List of query annotation UUIDs to identify. 
            If not specified or empty, uses all valid annotations in the database.
          items:
            type: string
            format: uuid
          example: 
            - "3833d7c9-820a-44e0-af8c-e06d749e7fce"
            - "a768243c-4456-4516-a2de-f2abc8702c0a"
        annot_name_list: # wbia/web/apis_engine.py:407
          type: array
          nullable: true
          description: |
            List to specify the query annotation names. 
            Must match length of annot_uuid_list if provided.
          items:
            type: string
            nullable: true
        query_config_dict: # wbia/web/apis_engine.py:410
          type: object
          description: Optional dictionary of algorithmic configuration parameters
        k: # wbia/web/apis_engine.py:391, wbia/web/apis_query.py:847
          type: integer
          default: 5
          description: Number of top matches to return per query annotation.
        callback_url: # wbia/web/apis_engine.py:778
          type: string
          nullable: true
          format: uri
          description: Optional URL that will be called when detection succeeds or fails
        callback_method: # wbia/web/job_engine.py:2123-2128
          type: string
          nullable: true
          enum: 
            - GET
            - POST
            - PUT
          default: POST 
          description: HTTP method for callback_url, defaults to POST if none is specified
        callback_detailed: # wbia/web/job_engine.py:2133-2137
          type: boolean
          default: false 
          description: Whether to include detailed results in callback
        lane: # wbia/web/job_engine.py:497
          type: string 
          enum:
            - fast
            - slow 
          default: slow
          description: Job queue lane (fast for quick jobs and slow for lower priority jobs)
        jobid: # wbia/web/job_engine.py:1112, wbia/web/job_engine.py:1398
          type: string
          nullable: true
          description: Optional custom job ID # restrictions TBD: https://wildme.slack.com/archives/C09M79QFTMY/p1761066892770159

    GetMatchRequestBodySchema:
      type: object 
      properties:
        query_annot_uuid_list: # wbia/web/apis_engine.py:490
          type: array
          nullable: true
          description: List containing exactly one query annotation UUID to identify.
          items:
            type: string
            format: uuid
          example: 
            - "3833d7c9-820a-44e0-af8c-e06d749e7fce"
        query_annot_name_list: # wbia/web/apis_engine.py:492
          type: array
          nullable: true
          description: |
            Optional list to specify the query annotation names. 
            Must match length of query_annot_uuid_list if provided.
          items:
            type: string
            nullable: true
        database_annot_uuid_list: # wbia/web/apis_engine.py:493
          type: array
          nullable: true
          description:  |
            Optional list of the annotation UUIDs that the algorithm is allowed to use for identification.  
            If not specified, all annotations are used. 
            CANNOT be used together with database_imgsetid.
          items:
            type: string
            format: uuid
          example: 
            - "3833d7c9-820a-44e0-af8c-e06d749e7fce"
            - "a768243c-4456-4516-a2de-f2abc8702c0a"
        database_annot_name_list: # wbia/web/apis_engine.py:496
          type: array
          nullable: true
          description: |
            Optional list to specify the database annotation names. 
            Must match length of database_annot_uuid_list if provided.
          items:
            type: string
            nullable: true
        database_imgsetid: # wbia/web/apis_engine.py:473, wbia/control/manual_imageset_funcs.py:449, wbia/control/manual_imageset_funcs.py:532
          type: integer # integer row ID, automatically converted to a list by @accessor_decors.getter_1toM (getter_vector_output in wbia/control/accessor_decors.py:474) at wbia/control/manual_imageset_funcs.py:447
          nullable: true
          description: |
            Optional image set ID to restrict database annotations to a specific image set. 
            CANNOT be used together with database_annot_uuid_list.
        matching_state_list:
          type: array
          description: |
            Optional list of matching state description to guide graph inference.
            Each list item is a 3-tuple: [query_annot_uuid, database_annot_uuid, state] 
            Valid states are:
              - "matched" 
              - "notmatched" / "nonmatch" 
              - "notcomparable" 
            If not specified or empty, the algorithm runs without human feedback constraint.
          items:
            type: array
            items:
              type: string
            minItems: 3
            maxItems: 3
          example: 
            - ["uuid1", "uuid2", "matched"]
            - ["uuid1", "uuid3", "notmatched"]
        query_config_dict: # wbia/web/apis_engine.py:410
          type: object
          description: Optional dictionary of algorithmic configuration parameters
        echo_query_params: # wbia/web/apis_engine.py:502
          type: boolean
          default: true 
          description: |
            Whether to return the following query parameters with the result:
              - query_annot_uuid_list
              - database_annot_uuid_list
              - query_config_dict
        include_qaid_in_daids: # wbia/web/apis_engine.py:477, wbia/web/apis_engine.py:669, wbia/algo/hots/pipeline.py:295
          type: boolean
          default: true 
          description: |
            Whether to include the query annotation in the database list for caching optimization.
            Self-matches are automatically filtered out by the pipeline regardless of this setting.
        callback_url: # wbia/web/apis_engine.py:778
          type: string
          nullable: true
          format: uri
          description: Optional URL that will be called when detection succeeds or fails
        callback_method: # wbia/web/job_engine.py:2123-2128
          type: string
          nullable: true
          enum: 
            - GET
            - POST
            - PUT
          default: POST 
          description: HTTP method for callback_url, defaults to POST if none is specified
        callback_detailed: # wbia/web/job_engine.py:2133-2137
          type: boolean
          default: false 
          description: Whether to include detailed results in callback
        lane: # wbia/web/job_engine.py:497
          type: string 
          enum:
            - fast
            - slow 
          default: slow
          description: Job queue lane (fast for quick jobs and slow for lower priority jobs)
        jobid: # wbia/web/job_engine.py:1112, wbia/web/job_engine.py:1398
          type: string
          nullable: true
          description: Optional custom job ID # restrictions TBD: https://wildme.slack.com/archives/C09M79QFTMY/p1761066892770159

    ###############################################################################
    # ANNOTATION REQUEST BODY SCHEMAS
    ###############################################################################

    AddAnnotationRequestBodySchema: # wbia/web/apis_json.py:550
      type: object 
      required:
        - image_uuid_list
        - annot_bbox_list
        - annot_theta_list
      properties:
        image_uuid_list: # wbia/web/apis_json.py:574
          type: array
          description: A list of image UUIDs to be used in IBEIS IA
          items:
            type: string
            format: uuid
        annot_bbox_list: # wbia/web/apis_json.py:575
          type: array
          description: |
            A list of bounding box coordinates encoded as a 4-tuple of the values 
            (xtl, ytl, width, height) where xtl is the 'top left corner, 
            x value' and ytl is the 'top left corner, y value'.
          items:
            type: array
            items:
              type: number
            minItems: 4
            maxItems: 4
          example: 
            - ["x value of top left corner", "y value of top left corner", "width", "height"]
        annot_theta_list: # wbia/web/apis_json.py:578
          type: array
          description: |
            A list of radian rotation around center. 
            Defaults to 0.0 (no rotation).
          items:
            type: number
        annot_viewpoint_list: # wbia/web/apis_json.py:556
          type: array
          description: |
            A list of viewpoint for the annotation, if known.
            If the list is partially known, use None (null in JSON) for unknown entries.
          items:
            type: string
            nullable: true 
        annot_quality_list: # wbia/web/apis_json.py:557
          type: array
          description: |
            A list of quality for the annotation, if known.
            If the list is partially known, use None (null in JSON) for unknown entries.
          items:
            type: string
            nullable: true 
        annot_species_list: # wbia/web/apis_json.py:580
          type: array
          description: |
            A list of species for the annotation, if known.
            If the list is partially known, use None (null in JSON) for unknown entries.
          items:
            type: string
            nullable: true 
        annot_multiple_list: # wbia/web/apis_json.py:559
          type: array
          description: |
            A list of boolean indicating whether each annotation contains multiple individuals.
            If the list is partially known, use None (null in JSON) for unknown entries.
          items:
            type: boolean
            nullable: true 
        annot_interest_list: # wbia/web/apis_json.py:560
          type: array
          description: |
            A list of boolean indicating whether each annotation is of interest.
            If the list is partially known, use None (null in JSON) for unknown entries.
          items:
            type: boolean
            nullable: true 
        annot_name_list: # wbia/web/apis_json.py:582
          type: array
          nullable: true
          description: |
            List of names for the annotation, if known.
            If the list is partially known, use None (null in JSON) for unknown entries.
          items:
            type: string
            nullable: true 
        annot_uuid_list: # wbia/web/apis_json.py:584
          type: array
          nullable: true
          description: |
            List of annotation UUIDs to assign to the new annotations being added; 
            if provided, these UUIDs will be used for the created annotations.
            If the list is partially known, use None (null in JSON) for unknown entries.
          items:
            type: string
            format: uuid
            nullable: true 

    DeleteAnnotationRequestBodySchema: # wbia/web/apis_json.py:2162
      type: object 
      required:
        - annot_uuid_list
      properties:
        annot_uuid_list: # wbia/web/apis_json.py:2170
          type: array
          description: List of annotation UUIDs to delete from the database
          items:
            type: string
            format: uuid
          example:
            - "3833d7c9-820a-44e0-af8c-e06d749e7fce"
            - "a768243c-4456-4516-a2de-f2abc8702c0a"

    ###############################################################################
    # IMAGE REQUEST BODY SCHEMAS
    ###############################################################################

    AddImageRequestBodySchema: # wbia/web/apis_json.py:295
      type: object 
      required:
        - image_uri_list
      properties:
        image_uri_list: # wbia/web/apis_json.py:312
          type: array
          description: |
            List of string image uris, most likely HTTP(S) or S3 encoded URLs.
            Alternatively, this can be a list of dictionaries (JSON objects) 
            that specify AWS S3 stored assets.         

            Note that you cannot specify AWS authentication access ids or secret keys
            using string uri's. For specific authentication methods, please use the
            latter list of dictionaries.
            
            An example below:
            image_uri_list = [
                'http://domain.com/example/asset1.png',
                '/home/example/Desktop/example/asset2.jpg',
                's3://s3.amazon.com/example-bucket-2/asset1-in-bucket-2.tif',
                {
                    'bucket'          : 'example-bucket-1',
                    'key'             : 'example/asset1.png',
                    'auth_domain'     : None,  # Uses 127.0.0.1
                    'auth_access_id'  : None,  # Uses system default
                    'auth_secret_key' : None,  # Uses system default
                },
                {
                    'bucket' : 'example-bucket-1',
                    'key'    : 'example/asset2.jpg',
                    # if unspecified, auth uses 127.0.0.1 and system defaults
                },
                {
                    'bucket'          : 'example-bucket-2',
                    'key'             : 'example/asset1-in-bucket-2.tif',
                    'auth_domain'     : 's3.amazon.com',
                    'auth_access_id'  : '____________________',
                    'auth_secret_key' : '________________________________________',
                },
            ]
          items:
            anyOf:
              - type: string
                format: uri
                description: Image uris (HTTP(S), S3 encoded URLs, or file paths)
              - type: object
                description: Dictionaries (JSON objects) that specify AWS S3 stored assets
                required:
                  - bucket
                  - key
                properties:
                  bucket:
                    type: string
                    description: AWS S3 bucket name
                  key:
                    type: string
                    description: Object key/path within the S3 bucket
                  auth_domain:
                    type: string
                    nullable: true
                    description: AWS S3 domain. If unspecified, auth uses 127.0.0.1.
                  auth_access_id:
                    type: string
                    nullable: true
                    description: AWS access key ID. If unspecified, auth uses system defaults.
                  auth_secret_key:
                    type: string
                    nullable: true
                    description: AWS secret access key. If unspecified, auth uses system defaults.
        image_unixtime_list: # wbia/web/apis_json.py:298
          type: array
          nullable: true
          description: |
            Optional list of image unix timestamps. 
            Must match length of image_uri_list if provided.
            Set the value to null for unknown timestamps.
          items:
            type: number
            nullable: true 
        image_gps_lat_list: # wbia/web/apis_json.py:346
          type: array
          nullable: true
          description: |
            Optional list of image GPS latitude values. 
            Must match length of image_uri_list if provided.
            Must be provided with image_gps_lon_list for effects.
            Set the value to null for unknown coordinates.
            If a value is set to null, the corresponding longitude value must also be null.
          items:
            type: number
            nullable: true
        image_gps_lon_list: # wbia/web/apis_json.py:347
          type: array
          nullable: true
          description: |
            Optional list of image GPS longitude values. 
            Must match length of image_uri_list if provided.
            Must be provided with image_gps_lat_list for effects.
            Set the value to null for unknown coordinates.
            If a value is set to null, the corresponding latitude value must also be null.
          items:
            type: number
            nullable: true

  responses:
    ###############################################################################
    # SUCCESS RESPONSES
    ###############################################################################

    Success200WithJobId:
      description: Successful operation with job id response 
      content:
        application/json:
          schema: 
            $ref: '#/components/schemas/Envelope' 
          example:
            status:
              success: true
              code: 200
              message: "Job queued successfully"
              cache: -1
            response:
              job_id: "3833d7c9-820a-44e0-af8c-e06d749e7fce"

    Success200WithJobIds:
      description: Successful operation with job id list response
      content:
        application/json:
          schema: 
            $ref: '#/components/schemas/Envelope' 
          example:
            status:
              success: true
              code: 200
              message: "Job IDs retrieved successfully"
              cache: -1
            response:
              job_id: 
                - "3833d7c9-820a-44e0-af8c-e06d749e7fce"
                - "a768243c-4456-4516-a2de-f2abc8702c0a"

    Success200WithJobStatus:
      description: |
        Successful operation with job status response.
        If jobid is specified, returns the status of the specified job.
        If jobid is not specified, returns a dictionary containing the status of all jobs. 
        
        Job status can be any of:
          - received:   job has been received, but not ingested yet
          - accepted:   job has been accepted (validated)
          - queued:     job has been transferred to the engine queue
          - working:    job is being worked on by the engine
          - publishing: job is done on the engine, pushing results to collector
          - completed:  job is complete  
          - exception:  job has an error 
          - corrupted:  job is corrupted because of missing engine_request, metadata, or jobcounter (wbia/web/job_engine.py:767,774,783)
          - suppressed: job has been suppressed (when attempts >= MAX_ATTEMPTS, wbia/web/job_engine.py:766)
          - unknown:    job ID not found (when job ID is specified, wbia/web/job_engine.py:2195)
      content:
        application/json:
          schema: 
            $ref: '#/components/schemas/Envelope' 
          example:
            status:
              success: true
              code: 200
              message: "Job status retrieved successfully"
              cache: -1
            response:
              result: "Job-specific status or dictionary containing all job status"

    Success200WithJobResult:
      description: Successful operation with job result response
      content:
        application/json:
          schema: 
            $ref: '#/components/schemas/Envelope' 
          example:
            status:
              success: true
              code: 200
              message: "Job result retrieved successfully"
              cache: -1
            response:
              result: "Job-specific result"

    Success200WithCreationAnnotationUUIDs:
      description: Successful operation with annotation UUIDs response
      content:
        application/json:
          schema: 
            $ref: '#/components/schemas/Envelope' 
          example:
            status:
              success: true
              code: 200
              message: "Annotations created successfully"
              cache: -1
            response:
              annot_uuid_list: 
                - "3833d7c9-820a-44e0-af8c-e06d749e7fce"
                - "a768243c-4456-4516-a2de-f2abc8702c0a"

    Success200WithRetrievalAnnotationUUIDs:
      description: Successful operation with annotation UUIDs response
      content:
        application/json:
          schema: 
            $ref: '#/components/schemas/Envelope' 
          example:
            status:
              success: true
              code: 200
              message: "Annotations retrieved successfully"
              cache: -1
            response:
              annot_uuid_list: 
                - "3833d7c9-820a-44e0-af8c-e06d749e7fce"
                - "a768243c-4456-4516-a2de-f2abc8702c0a"

    Success200WithDeletionAnnotationUUIDs:
      description: Successful operation with true response
      content:
        application/json:
          schema: 
            $ref: '#/components/schemas/Envelope' 
          example:
            status:
              success: true
              code: 200
              message: "Annotations deleted successfully"
              cache: -1
            response:
              type: boolean
              example: true
              description: Returns true when deletion succeeds

    Success200WithCreationImageUUIDs:
      description: Successful operation with Image UUIDs response
      content:
        application/json:
          schema: 
            $ref: '#/components/schemas/Envelope' 
          example:
            status:
              success: true
              code: 200
              message: "Image paths added successfully"
              cache: -1
            response:
              image_uuid_list: 
                - "3833d7c9-820a-44e0-af8c-e06d749e7fce"
                - "a768243c-4456-4516-a2de-f2abc8702c0a"

    Success200WithRetrievalImageUUIDs:
      description: Successful operation with Image UUIDs response
      content:
        application/json:
          schema: 
            $ref: '#/components/schemas/Envelope' 
          example:
            status:
              success: true
              code: 200
              message: "Image UUIDs retrieved successfully"
              cache: -1
            response:
              image_uuid_list: 
                - "3833d7c9-820a-44e0-af8c-e06d749e7fce"
                - "a768243c-4456-4516-a2de-f2abc8702c0a"

    ###############################################################################
    # ERROR RESPONSES
    ###############################################################################

    MissingOrInvalidInput400: 
    # WebMissingInput: wbia/control/controller_inject.py:361
    # WebInvalidInput: wbia/control/controller_inject.py:372-382
      description: Missing required parameter or invalid input (non-image)
      content:
        application/json:
          schema: 
            $ref: '#/components/schemas/Envelope'

    Unauthorized401: # authentication_challenge: wbia/control/controller_inject.py:648
      description: Authentication required
      headers:
        WWW-Authenticate:
          schema: 
            type: string 
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Envelope'

    InvalidImageInput415: # WebInvalidInput: wbia/control/controller_inject.py:372-382
      description: Invalid image input
      content:
        application/json:
          schema: 
            $ref: '#/components/schemas/Envelope'

    WebRuntimeException500: # WebRuntimeException: wbia/control/controller_inject.py:385
      description: Runtime exception
      content:
        application/json:
          schema: 
            $ref: '#/components/schemas/Envelope'

    # WBIA custom status codes (600-609)
    MissingUUID600: # WebMissingUUIDException: wbia/control/controller_inject.py:221
      description: Missing image and/or annotation UUIDs
      content: 
        application/json: 
          schema: 
            $ref: '#/components/schemas/Envelope'

    DuplicateUUID601: # WebDuplicateUUIDException: wbia/control/controller_inject.py:236
      description: Some UUIDs are specified more than once
      content: 
        application/json: 
          schema: 
            $ref: '#/components/schemas/Envelope'

    UnknownUUID602: # WebUnknownUUIDException: wbia/control/controller_inject.py:253
      description: Unknown UUIDs
      content: 
        application/json:
          schema: 
            $ref: '#/components/schemas/Envelope'

    ReviewNotReady603: # WebReviewNotReadyException: wbia/control/controller_inject.py:269
      description: The query_uuid is not yet ready for review
      content: 
        application/json: 
          schema: 
            $ref: '#/components/schemas/Envelope'

    UnavailableUUID604: # WebUnavailableUUIDException: wbia/control/controller_inject.py:280
