GetCompleteMatchRequestBodySchema:  
  type: object 
  properties:
    annot_uuid_list: # wbia/web/apis_engine.py:405
      type: array
      nullable: true
      description: |
        List of query annotation UUIDs to identify. 
        If not specified or empty, uses all valid annotations in the database.
      items:
        type: string
        format: uuid
      example: 
        - "3833d7c9-820a-44e0-af8c-e06d749e7fce"
        - "a768243c-4456-4516-a2de-f2abc8702c0a"
    annot_name_list: # wbia/web/apis_engine.py:407
      type: array
      nullable: true
      description: |
        List to specify the query annotation names. 
        Must match length of annot_uuid_list if provided.
      items:
        type: string
        nullable: true
    query_config_dict: # wbia/web/apis_engine.py:410
      type: string # see how the JSON is parsed in wbia/control/controller_inject.py:470-480
      description: Optional dictionary of algorithmic configuration parameters
    k: # wbia/web/apis_engine.py:391, wbia/web/apis_query.py:847
      type: integer
      default: 5
      description: Number of top matches to return per query annotation.
    callback_url: # wbia/web/apis_engine.py:778
      type: string
      nullable: true
      format: uri
      description: Optional URL that will be called when detection succeeds or fails
    callback_method: # wbia/web/job_engine.py:2123-2128
      type: string
      nullable: true
      enum: 
        - GET
        - POST
        - PUT
      default: POST 
      description: HTTP method for callback_url, defaults to POST if none is specified
    callback_detailed: # wbia/web/job_engine.py:2133-2137
      type: boolean
      default: false 
      description: Whether to include detailed results in callback
    lane: # wbia/web/job_engine.py:497
      type: string 
      enum:
        - fast
        - slow 
      default: slow
      description: Job queue lane (fast for quick jobs and slow for lower priority jobs)
    jobid: # wbia/web/job_engine.py:1112, wbia/web/job_engine.py:1398
      type: string
      nullable: true
      description: Optional custom job ID # restrictions TBD: https://wildme.slack.com/archives/C09M79QFTMY/p1761066892770159

GetMatchRequestBodySchema:
  type: object 
  properties:
    query_annot_uuid_list: # wbia/web/apis_engine.py:490
      type: array
      nullable: true
      description: List containing exactly one query annotation UUID to identify.
      items:
        type: string
        format: uuid
      example: 
        - "3833d7c9-820a-44e0-af8c-e06d749e7fce"
    query_annot_name_list: # wbia/web/apis_engine.py:492
      type: array
      nullable: true
      description: |
        Optional list to specify the query annotation names. 
        Must match length of query_annot_uuid_list if provided.
      items:
        type: string
        nullable: true
    database_annot_uuid_list: # wbia/web/apis_engine.py:493
      type: array
      nullable: true
      description:  |
        Optional list of the annotation UUIDs that the algorithm is allowed to use for identification.  
        If not specified, all annotations are used. 
        CANNOT be used together with database_imgsetid.
      items:
        type: string
        format: uuid
      example: 
        - "3833d7c9-820a-44e0-af8c-e06d749e7fce"
        - "a768243c-4456-4516-a2de-f2abc8702c0a"
    database_annot_name_list: # wbia/web/apis_engine.py:496
      type: array
      nullable: true
      description: |
        Optional list to specify the database annotation names. 
        Must match length of database_annot_uuid_list if provided.
      items:
        type: string
        nullable: true
    database_imgsetid: # wbia/web/apis_engine.py:473, wbia/control/manual_imageset_funcs.py:449, wbia/control/manual_imageset_funcs.py:532
      type: integer # integer row ID, automatically converted to a list by @accessor_decors.getter_1toM (getter_vector_output in wbia/control/accessor_decors.py:474) at wbia/control/manual_imageset_funcs.py:447
      nullable: true
      description: |
        Optional image set ID to restrict database annotations to a specific image set. 
        CANNOT be used together with database_annot_uuid_list.
    matching_state_list:
      type: array
      description: |
        Optional list of matching state description to guide graph inference.
        Each list item is a 3-tuple: [query_annot_uuid, database_annot_uuid, state] 
        Valid states are:
          - "matched" 
          - "notmatched" / "nonmatch" 
          - "notcomparable" 
        If not specified or empty, the algorithm runs without human feedback constraint.
      items:
        type: array
        items:
          type: string
        minItems: 3
        maxItems: 3
      example: 
        - ["uuid1", "uuid2", "matched"]
        - ["uuid1", "uuid3", "notmatched"]
    query_config_dict: # wbia/web/apis_engine.py:410
      type: string # see how the JSON is parsed in wbia/control/controller_inject.py:470-480
      description: Optional dictionary of algorithmic configuration parameters
    echo_query_params: # wbia/web/apis_engine.py:502
      type: boolean
      default: true 
      description: |
        Whether to return the following query parameters with the result:
          - query_annot_uuid_list
          - database_annot_uuid_list
          - query_config_dict
    include_qaid_in_daids: # wbia/web/apis_engine.py:477, wbia/web/apis_engine.py:669, wbia/algo/hots/pipeline.py:295
      type: boolean
      default: true 
      description: |
        Whether to include the query annotation in the database list for caching optimization.
        Self-matches are automatically filtered out by the pipeline regardless of this setting.
    callback_url: # wbia/web/apis_engine.py:778
      type: string
      nullable: true
      format: uri
      description: Optional URL that will be called when detection succeeds or fails
    callback_method: # wbia/web/job_engine.py:2123-2128
      type: string
      nullable: true
      enum: 
        - GET
        - POST
        - PUT
      default: POST 
      description: HTTP method for callback_url, defaults to POST if none is specified
    callback_detailed: # wbia/web/job_engine.py:2133-2137
      type: boolean
      default: false 
      description: Whether to include detailed results in callback
    lane: # wbia/web/job_engine.py:497
      type: string 
      enum:
        - fast
        - slow 
      default: slow
      description: Job queue lane (fast for quick jobs and slow for lower priority jobs)
    jobid: # wbia/web/job_engine.py:1112, wbia/web/job_engine.py:1398
      type: string
      nullable: true
      description: Optional custom job ID # restrictions TBD: https://wildme.slack.com/archives/C09M79QFTMY/p1761066892770159

