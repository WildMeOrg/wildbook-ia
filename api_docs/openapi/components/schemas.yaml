# ANNOTATION REQUEST BODY SCHEMAS
###############################################################################

AddAnnotationRequestBodySchema: # wbia/web/apis_json.py:550
  type: object 
  required:
    - image_uuid_list
    - annot_bbox_list
    - annot_theta_list
  properties:
    image_uuid_list: # wbia/web/apis_json.py:574
      type: array
      description: A list of image UUIDs to be used in IBEIS IA
      items:
        type: string
        format: uuid
    annot_bbox_list: # wbia/web/apis_json.py:575
      type: array
      description: |
        A list of bounding box coordinates encoded as a 4-tuple of the values 
        (xtl, ytl, width, height) where xtl is the 'top left corner, 
        x value' and ytl is the 'top left corner, y value'.
      items:
        type: array
        items:
          type: number
        minItems: 4
        maxItems: 4
      example: 
        - ["x value of top left corner", "y value of top left corner", "width", "height"]
    annot_theta_list: # wbia/web/apis_json.py:578
      type: array
      description: |
        A list of radian rotation around center. 
        Defaults to 0.0 (no rotation).
      items:
        type: number
    annot_viewpoint_list: # wbia/web/apis_json.py:556
      type: array
      description: |
        A list of viewpoint for the annotation, if known.
        If the list is partially known, use None (null in JSON) for unknown entries.
      items:
        type: string
        nullable: true 
    annot_quality_list: # wbia/web/apis_json.py:557
      type: array
      description: |
        A list of quality for the annotation, if known.
        If the list is partially known, use None (null in JSON) for unknown entries.
      items:
        type: string
        nullable: true 
    annot_species_list: # wbia/web/apis_json.py:580
      type: array
      description: |
        A list of species for the annotation, if known.
        If the list is partially known, use None (null in JSON) for unknown entries.
      items:
        type: string
        nullable: true 
    annot_multiple_list: # wbia/web/apis_json.py:559
      type: array
      description: |
        A list of boolean indicating whether each annotation contains multiple individuals.
        If the list is partially known, use None (null in JSON) for unknown entries.
      items:
        type: boolean
        nullable: true 
    annot_interest_list: # wbia/web/apis_json.py:560
      type: array
      description: |
        A list of boolean indicating whether each annotation is of interest.
        If the list is partially known, use None (null in JSON) for unknown entries.
      items:
        type: boolean
        nullable: true 
    annot_name_list: # wbia/web/apis_json.py:582
      type: array
      nullable: true
      description: |
        List of names for the annotation, if known.
        If the list is partially known, use None (null in JSON) for unknown entries.
      items:
        type: string
        nullable: true 
    annot_uuid_list: # wbia/web/apis_json.py:584
      type: array
      nullable: true
      description: |
        List of annotation UUIDs to assign to the new annotations being added; 
        if provided, these UUIDs will be used for the created annotations.
        If the list is partially known, use None (null in JSON) for unknown entries.
      items:
        type: string
        format: uuid
        nullable: true 

###############################################################################
# IMAGE REQUEST BODY SCHEMAS
###############################################################################

AddImageRequestBodySchema: # wbia/web/apis_json.py:295
  type: object 
  required:
    - image_uri_list
  properties:
    image_uri_list: # wbia/web/apis_json.py:312
      type: array
      description: |
        List of string image uris, most likely HTTP(S) or S3 encoded URLs.
        Alternatively, this can be a list of dictionaries (JSON objects) 
        that specify AWS S3 stored assets.         

        Note that you cannot specify AWS authentication access ids or secret keys
        using string uri's. For specific authentication methods, please use the
        latter list of dictionaries.
        
        An example below:
        image_uri_list = [
            'http://domain.com/example/asset1.png',
            '/home/example/Desktop/example/asset2.jpg',
            's3://s3.amazon.com/example-bucket-2/asset1-in-bucket-2.tif',
            {
                'bucket'          : 'example-bucket-1',
                'key'             : 'example/asset1.png',
                'auth_domain'     : None,  # Uses 127.0.0.1
                'auth_access_id'  : None,  # Uses system default
                'auth_secret_key' : None,  # Uses system default
            },
            {
                'bucket' : 'example-bucket-1',
                'key'    : 'example/asset2.jpg',
                # if unspecified, auth uses 127.0.0.1 and system defaults
            },
            {
                'bucket'          : 'example-bucket-2',
                'key'             : 'example/asset1-in-bucket-2.tif',
                'auth_domain'     : 's3.amazon.com',
                'auth_access_id'  : '____________________',
                'auth_secret_key' : '________________________________________',
            },
        ]
      items:
        anyOf:
          - type: string
            format: uri
            description: Image uris (HTTP(S), S3 encoded URLs, or file paths)
          - type: object
            description: Dictionaries (JSON objects) that specify AWS S3 stored assets
            required:
              - bucket
              - key
            properties:
              bucket:
                type: string
                description: AWS S3 bucket name
              key:
                type: string
                description: Object key/path within the S3 bucket
              auth_domain:
                type: string
                nullable: true
                description: AWS S3 domain. If unspecified, auth uses 127.0.0.1.
              auth_access_id:
                type: string
                nullable: true
                description: AWS access key ID. If unspecified, auth uses system defaults.
              auth_secret_key:
                type: string
                nullable: true
                description: AWS secret access key. If unspecified, auth uses system defaults.
    image_unixtime_list: # wbia/web/apis_json.py:298
      type: array
      nullable: true
      description: |
        Optional list of image unix timestamps. 
        Must match length of image_uri_list if provided.
        Set the value to null for unknown timestamps.
      items:
        type: number
        nullable: true 
    image_gps_lat_list: # wbia/web/apis_json.py:346
      type: array
      nullable: true
      description: |
        Optional list of image GPS latitude values. 
        Must match length of image_uri_list if provided.
        Must be provided with image_gps_lon_list for effects.
        Set the value to null for unknown coordinates.
        If a value is set to null, the corresponding longitude value must also be null.
      items:
        type: number
        nullable: true
    image_gps_lon_list: # wbia/web/apis_json.py:347
      type: array
      nullable: true
      description: |
        Optional list of image GPS longitude values. 
        Must match length of image_uri_list if provided.
        Must be provided with image_gps_lat_list for effects.
        Set the value to null for unknown coordinates.
        If a value is set to null, the corresponding latitude value must also be null.
      items:
        type: number
        nullable: true